<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pure-Grace Revival Ministries</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;900&family=Lato:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --royal: #0A2D6E;
      --mid: #1757C2;
      --sky: #3A8FFF;
      --light: #A8CAFF;
      --white: #FFFFFF;
      --off: #F0F5FF;
      --gold: #FFCC44;
      --dark: #060F24;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--dark);
      color: var(--white);
      overflow-x: hidden;
    }

    /* ── NAVBAR ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 6%;
      background: rgba(6, 15, 36, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(55, 143, 255, 0.2);
      transition: padding 0.3s;
    }
    .nav-logo {
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      color: var(--white);
      line-height: 1.2;
    }
    .nav-logo span { color: var(--gold); }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--light);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--gold); }
    .nav-cta {
      background: var(--gold);
      color: var(--royal) !important;
      padding: 8px 20px;
      border-radius: 2px;
      font-weight: 700 !important;
    }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
    .hamburger span { width: 26px; height: 2px; background: var(--white); transition: 0.3s; }

    /* ── HERO ── */
    #home {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 100px 6% 60px;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 60% 40%, rgba(23,87,194,0.45) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 20% 70%, rgba(10,45,110,0.6) 0%, transparent 65%),
        linear-gradient(160deg, #060F24 0%, #0A1E50 50%, #060F24 100%);
    }
    .hero-rays {
      position: absolute; inset: 0;
      background: repeating-conic-gradient(from 270deg at 65% 40%, rgba(58,143,255,0.04) 0deg, transparent 3deg, transparent 10deg);
      animation: rotate-rays 60s linear infinite;
    }
    @keyframes rotate-rays { to { transform: rotate(360deg); } }
    .hero-glow {
      position: absolute; width: 600px; height: 600px;
      border-radius: 50%;
      top: 50%; left: 60%; transform: translate(-50%,-50%);
      background: radial-gradient(circle, rgba(58,143,255,0.18) 0%, transparent 70%);
      animation: pulse-glow 4s ease-in-out infinite alternate;
    }
    @keyframes pulse-glow { from { transform: translate(-50%,-50%) scale(1); } to { transform: translate(-50%,-50%) scale(1.15); } }
    .hero-cross {
      position: absolute; right: 8%; top: 50%; transform: translateY(-50%);
      width: 220px; height: 220px; opacity: 0.06;
    }
    .hero-cross::before, .hero-cross::after {
      content: ''; position: absolute; background: var(--white);
    }
    .hero-cross::before { width: 30px; height: 100%; left: 50%; transform: translateX(-50%); }
    .hero-cross::after { height: 30px; width: 100%; top: 30%; transform: translateY(-50%); }

    .hero-content {
      position: relative; z-index: 2;
      max-width: 700px;
    }
    .hero-badge {
      display: inline-block;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid rgba(255,204,68,0.4);
      padding: 6px 18px;
      margin-bottom: 28px;
      animation: fadeUp 0.8s ease both;
    }
    .hero-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(2.2rem, 5vw, 4.2rem);
      font-weight: 900;
      line-height: 1.1;
      color: var(--white);
      animation: fadeUp 0.8s 0.15s ease both;
    }
    .hero-title .highlight {
      display: block;
      background: linear-gradient(90deg, var(--sky), var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero-subtitle {
      font-size: 1.15rem;
      font-weight: 300;
      line-height: 1.8;
      color: var(--light);
      margin: 24px 0 40px;
      animation: fadeUp 0.8s 0.3s ease both;
    }
    .hero-buttons {
      display: flex; gap: 16px; flex-wrap: wrap;
      animation: fadeUp 0.8s 0.45s ease both;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--mid), var(--sky));
      color: var(--white);
      padding: 16px 36px;
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border: none; cursor: pointer;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn-outline {
      border: 1px solid rgba(168,202,255,0.5);
      color: var(--light);
      padding: 16px 36px;
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      background: transparent;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, transform 0.2s;
    }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }

    .hero-stats {
      position: absolute; bottom: 50px; left: 6%; right: 6%;
      display: flex; gap: 40px; flex-wrap: wrap;
      animation: fadeUp 0.8s 0.6s ease both;
      z-index: 2;
    }
    .stat { text-align: left; }
    .stat-num {
      font-family: 'Cinzel', serif;
      font-size: 2rem; font-weight: 900;
      color: var(--gold);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.7rem; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--light);
      margin-top: 4px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── SECTIONS ── */
    section { padding: 100px 6%; }
    .section-label {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: 12px;
    }
    .section-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.8rem, 3.5vw, 3rem);
      font-weight: 900;
      color: var(--white);
      line-height: 1.2;
      margin-bottom: 20px;
    }
    .section-title span { color: var(--sky); }
    .section-desc {
      font-size: 1.05rem; font-weight: 300;
      line-height: 1.9; color: var(--light);
      max-width: 600px;
    }
    .divider {
      width: 60px; height: 3px;
      background: linear-gradient(90deg, var(--sky), var(--gold));
      margin: 20px 0 40px;
    }

    /* ── ABOUT ── */
    #about {
      background: linear-gradient(160deg, #0A1633 0%, #060F24 100%);
      position: relative; overflow: hidden;
    }
    #about::before {
      content: '';
      position: absolute; top: -100px; right: -100px;
      width: 500px; height: 500px; border-radius: 50%;
      border: 1px solid rgba(58,143,255,0.1);
    }
    #about::after {
      content: '';
      position: absolute; top: -50px; right: -50px;
      width: 300px; height: 300px; border-radius: 50%;
      border: 1px solid rgba(58,143,255,0.08);
    }
    .about-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 80px; align-items: center;
    }
    .about-visual {
      position: relative; display: flex; align-items: center; justify-content: center;
    }
    .about-card {
      background: linear-gradient(145deg, rgba(23,87,194,0.2), rgba(10,45,110,0.3));
      border: 1px solid rgba(58,143,255,0.2);
      padding: 50px 40px;
      text-align: center;
      position: relative;
      clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
    }
    .about-card-icon {
      font-size: 4rem; margin-bottom: 20px; display: block;
    }
    .about-card h3 {
      font-family: 'Cinzel', serif;
      font-size: 1.3rem; color: var(--white); margin-bottom: 12px;
    }
    .about-card p { color: var(--light); line-height: 1.8; font-weight: 300; }
    .values-list { list-style: none; margin-top: 30px; }
    .values-list li {
      padding: 14px 0;
      border-bottom: 1px solid rgba(58,143,255,0.1);
      display: flex; align-items: center; gap: 14px;
      font-size: 0.95rem; color: var(--light);
    }
    .values-list li::before {
      content: '✦';
      color: var(--gold); font-size: 0.7rem; flex-shrink: 0;
    }

    /* ── SERMONS ── */
    #sermons { background: var(--dark); }
    .sermons-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 24px; margin-top: 50px;
    }
    .sermon-card {
      background: linear-gradient(160deg, rgba(23,87,194,0.12), rgba(6,15,36,0.8));
      border: 1px solid rgba(58,143,255,0.15);
      padding: 32px 28px;
      transition: transform 0.3s, border-color 0.3s;
      cursor: pointer;
      position: relative; overflow: hidden;
    }
    .sermon-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--mid), var(--sky));
      transform: scaleX(0); transform-origin: left;
      transition: transform 0.3s;
    }
    .sermon-card:hover { transform: translateY(-6px); border-color: rgba(58,143,255,0.4); }
    .sermon-card:hover::before { transform: scaleX(1); }
    .sermon-tag {
      display: inline-block;
      font-size: 0.65rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--sky);
      border: 1px solid rgba(58,143,255,0.4);
      padding: 4px 10px; margin-bottom: 18px;
    }
    .sermon-card h3 {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem; color: var(--white);
      margin-bottom: 10px; line-height: 1.4;
    }
    .sermon-card p { color: var(--light); font-size: 0.88rem; font-weight: 300; line-height: 1.7; }
    .sermon-meta {
      display: flex; align-items: center; gap: 16px;
      margin-top: 20px;
      font-size: 0.75rem; color: rgba(168,202,255,0.6);
    }
    .sermon-play {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 22px;
      font-family: 'Cinzel', serif;
      font-size: 0.72rem; letter-spacing: 0.15em;
      color: var(--gold); text-decoration: none;
      text-transform: uppercase;
      transition: gap 0.2s;
    }
    .sermon-play:hover { gap: 14px; }

    /* ── EVENTS ── */
    #events {
      background: linear-gradient(160deg, #0D1E4A 0%, #060F24 100%);
    }
    .events-list { margin-top: 50px; display: flex; flex-direction: column; gap: 16px; }
    .event-item {
      display: grid; grid-template-columns: 80px 1fr auto;
      align-items: center; gap: 28px;
      background: rgba(23,87,194,0.1);
      border: 1px solid rgba(58,143,255,0.15);
      padding: 24px 32px;
      transition: background 0.3s, border-color 0.3s;
    }
    .event-item:hover { background: rgba(23,87,194,0.2); border-color: rgba(58,143,255,0.35); }
    .event-date {
      text-align: center;
      border-right: 1px solid rgba(58,143,255,0.2);
      padding-right: 28px;
    }
    .event-date .day {
      font-family: 'Cinzel', serif;
      font-size: 2rem; font-weight: 900; color: var(--gold); line-height: 1;
    }
    .event-date .month {
      font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--light); margin-top: 4px;
    }
    .event-info h3 {
      font-family: 'Cinzel', serif;
      font-size: 1rem; color: var(--white); margin-bottom: 6px;
    }
    .event-info p { font-size: 0.88rem; color: var(--light); font-weight: 300; }
    .event-time {
      font-size: 0.78rem; color: var(--sky);
      text-align: right; line-height: 1.6;
      white-space: nowrap;
    }

    /* ── GIVING ── */
    #giving {
      background: var(--dark);
      text-align: center;
      position: relative; overflow: hidden;
    }
    #giving::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(23,87,194,0.15) 0%, transparent 70%);
    }
    .giving-inner { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; }
    .giving-verse {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem; font-style: italic;
      color: var(--light); line-height: 1.8;
      margin-bottom: 50px;
      padding: 30px;
      border: 1px solid rgba(58,143,255,0.2);
      position: relative;
    }
    .giving-verse::before {
      content: '"';
      font-size: 5rem; color: var(--royal);
      position: absolute; top: -20px; left: 20px;
      font-family: Georgia, serif; line-height: 1;
    }
    .giving-options {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 16px; margin-bottom: 40px;
    }
    .giving-option {
      background: rgba(23,87,194,0.12);
      border: 1px solid rgba(58,143,255,0.2);
      padding: 28px 20px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .giving-option:hover {
      background: rgba(23,87,194,0.25);
      border-color: var(--sky); transform: translateY(-4px);
    }
    .giving-option .amount {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem; font-weight: 900; color: var(--gold);
    }
    .giving-option p { font-size: 0.8rem; color: var(--light); margin-top: 8px; }

    /* ── CONTACT ── */
    #contact {
      background: linear-gradient(160deg, #0A1633 0%, #060F24 100%);
    }
    .contact-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 60px; margin-top: 50px;
    }
    .contact-info { display: flex; flex-direction: column; gap: 28px; }
    .contact-block {
      display: flex; gap: 20px; align-items: flex-start;
    }
    .contact-icon {
      width: 44px; height: 44px;
      background: rgba(23,87,194,0.25);
      border: 1px solid rgba(58,143,255,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; flex-shrink: 0;
    }
    .contact-block h4 {
      font-family: 'Cinzel', serif;
      font-size: 0.78rem; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: 6px;
    }
    .contact-block p { color: var(--light); font-size: 0.92rem; font-weight: 300; line-height: 1.7; }
    .contact-form { display: flex; flex-direction: column; gap: 16px; }
    .form-group input,
    .form-group textarea {
      width: 100%;
      background: rgba(23,87,194,0.08);
      border: 1px solid rgba(58,143,255,0.2);
      color: var(--white);
      padding: 14px 18px;
      font-family: 'Lato', sans-serif;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus { border-color: var(--sky); }
    .form-group input::placeholder,
    .form-group textarea::placeholder { color: rgba(168,202,255,0.4); }
    .form-group textarea { height: 130px; resize: vertical; }

    /* ── SERVICE TIMES BANNER ── */
    .service-banner {
      background: linear-gradient(90deg, var(--royal), var(--mid), var(--royal));
      padding: 18px 6%;
      display: flex; align-items: center; justify-content: center; gap: 60px;
      flex-wrap: wrap;
    }
    .service-item {
      text-align: center;
    }
    .service-item span {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 0.65rem; letter-spacing: 0.25em;
      text-transform: uppercase; color: var(--gold);
    }
    .service-item strong {
      font-size: 0.95rem; color: var(--white);
      font-weight: 700;
    }

    /* ── FOOTER ── */
    footer {
      background: #040A1A;
      padding: 60px 6% 30px;
      border-top: 1px solid rgba(58,143,255,0.1);
    }
    .footer-grid {
      display: grid; grid-template-columns: 2fr 1fr 1fr;
      gap: 60px; margin-bottom: 50px;
    }
    .footer-brand h2 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.2rem; color: var(--white); margin-bottom: 14px;
    }
    .footer-brand h2 span { color: var(--gold); }
    .footer-brand p { color: var(--light); font-size: 0.88rem; font-weight: 300; line-height: 1.8; }
    .footer-col h4 {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: 20px;
    }
    .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .footer-col ul a {
      color: var(--light); text-decoration: none;
      font-size: 0.88rem; font-weight: 300;
      transition: color 0.2s;
    }
    .footer-col ul a:hover { color: var(--sky); }
    .footer-bottom {
      border-top: 1px solid rgba(58,143,255,0.1);
      padding-top: 24px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.78rem; color: rgba(168,202,255,0.4);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .about-grid, .contact-grid, .footer-grid { grid-template-columns: 1fr; gap: 40px; }
      .sermons-grid { grid-template-columns: 1fr; }
      .giving-options { grid-template-columns: 1fr; }
      .hero-stats { position: relative; bottom: auto; margin-top: 50px; }
      .event-item { grid-template-columns: 60px 1fr; }
      .event-time { display: none; }
    }
    @media (max-width: 600px) {
      section { padding: 70px 5%; }
      .service-banner { gap: 24px; }
    }
  </style>
</head>
<body>
